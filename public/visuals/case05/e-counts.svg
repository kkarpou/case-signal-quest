<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc"><title id="title">Δύο περιοχές, δύο συγκρίσεις</title><desc id="desc">Περιοχή Α: 120 παράπονα σε 120000 κατοίκους. Περιοχή Β: 60 σε 30000 κατοίκους.</desc><rect width="800" height="900" fill="#f7f1e5"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="42" fill="#176b70" font-size="21" font-weight="700" text-anchor="start">THE CROWD / ΦΑΚΕΛΟΣ 05</text><text x="36" y="93" fill="#202a2d" font-size="32" font-weight="700" text-anchor="start">Δύο περιοχές, δύο συγκρίσεις</text><line x1="36" y1="116" x2="764" y2="116" stroke="#202a2d" stroke-width="3"/><text x="36" y="165" fill="#202a2d" font-size="26" font-weight="500" text-anchor="start">Ίδια περίοδος • Ίδιος ορισμός παραπόνου</text><text x="36" y="225" fill="#202a2d" font-size="28" font-weight="700" text-anchor="start">Συνολικά παράπονα</text><line x1="105" y1="547.0" x2="755" y2="547.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="556.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">0</text><line x1="105" y1="491.0" x2="755" y2="491.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="500.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">30</text><line x1="105" y1="435.0" x2="755" y2="435.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="444.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">60</text><line x1="105" y1="379.0" x2="755" y2="379.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="388.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">90</text><line x1="105" y1="323.0" x2="755" y2="323.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="332.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">120</text><line x1="105" y1="267.0" x2="755" y2="267.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="276.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">150</text><line x1=
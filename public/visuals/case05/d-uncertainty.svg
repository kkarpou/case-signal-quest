<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc"><title id="title">Πόσο βέβαιο είναι το 51%;</title><desc id="desc">Εκτίμηση υπέρ 51%, αναφερόμενο περιθώριο ±4 ποσοστιαίες μονάδες: εύρος 47% έως 55%. Γραμμή αναφοράς στο 50%. Δεν προσδιορίζεται επίπεδο εμπιστοσύνης.</desc><rect width="800" height="900" fill="#f7f1e5"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="42" fill="#176b70" font-size="21" font-weight="700" text-anchor="start">THE CROWD / ΦΑΚΕΛΟΣ 05</text><text x="36" y="93" fill="#202a2d" font-size="32" font-weight="700" text-anchor="start">Πόσο βέβαιο είναι το 51%;</text><line x1="36" y1="116" x2="764" y2="116" stroke="#202a2d" stroke-width="3"/><text x="36" y="164" fill="#202a2d" font-size="28" font-weight="500" text-anchor="start">600 κάτοικοι • πιθανοτική επιλογή</text><text x="36" y="222" fill="#202a2d" font-size="34" font-weight="700" text-anchor="start">Υπέρ 51%     /     Κατά 49%</text><text x="36" y="274" fill="#202a2d" font-size="24" font-weight="500" text-anchor="start">Αναφερόμενο περιθώριο: ±4 ποσοστιαίες μονάδες</text><line x1="100.0" y1="370" x2="100.0" y2="585" stroke="#c7c9bd" stroke-width="2"/><text x="100.0" y="630" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">40%</text><line x1="250.0" y1="370" x2="250.0" y2="585" stroke="#c7c9bd" stroke-width="2"/><text x="250.0" y="630" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">45%</text><line x1="400.0" y1="370" x2="400.0" y2="585" stroke="#c7c9bd" stroke-width="2"/><text x="400.0" y="630" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">50%</text><line x1="550.0" y1="370" x2="550.0" y2="585" stroke="#c7c9bd" stroke-width="2"/><text x="550.0" y="630" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">55%</text><line x1="700.0" y1="370" x2="700.0" y2="585" stroke="#c7c9bd" stroke-width="2"/><text x="700.0" y="630" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">60%</text><line x1="400.0" y1="335" x2="400.0" y2="585" stroke="#a13f39" stroke-width="3" stroke-dasharray="8 8"/><text x="400.0" y="323" fill="#a13f39" font-size="27" font-weight="700" text-anchor="middle">50%</text><line x1="310.0" y1="465" x2="550.0" y2="465" stroke="#176b70" stroke-width="12"/><line x1="310.0" y1="438" x2="310.0" y2="492" stroke="#176b70" stroke-width="4"/><line x1="550.0" y1="438" x2="550.0" y2="492" stroke="#176b70" stroke-width="4"/><circle cx="430.0" cy="465" r="12" fill="#202a2d"/><text x="310.0" y="425" fill="#202a2d" font-size="27" font-weight="700" text-anchor="middle">47%</text><text x="430.0" y="535" fill="#202a2d" font-size="27" font-weight="700" text-anchor="middle">51%</text><text x="550.0" y="425" fill="#202a2d" font-size="27" font-weight="700" text-anchor="middle">55%</text><text x="36" y="697" fill="#202a2d" font-size="27" font-weight="500" text-anchor="start">Εύρος για το ποσοστό «υπέρ»: 47%–55%.</text><text x="36" y="744" fill="#202a2d" font-size="23" font-weight="500" text-anchor="start">Το επίπεδο εμπιστοσύνης δεν δίνεται στο σενάριο.</text><text x="36" y="795" fill="#202a2d" font-size="26" font-weight="700" text-anchor="start">Πού βρίσκεται το 50% σε αυτό το εύρος;</text><line x1="36" y1="840" x2="764" y2="840" stroke="#c7c9bd" stroke-width="2"/><text x="36" y="875" fill="#202a2d" font-size="20" font-weight="500" text-anchor="start">Φανταστικά δεδομένα • Εκπαιδευτική προσομοίωση</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc"><title id="title">Από την πόλη στην ψηφοφορία</title><desc id="desc">Σύνδεσμος σε ομάδα κατά του σταθμού. Αυτοεπιλογή 1000 απαντησάντων: 780 υπέρ, 220 λοιπές απαντήσεις. Η στάση της πόλης είναι άγνωστη.</desc><rect width="800" height="900" fill="#f7f1e5"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="42" fill="#176b70" font-size="21" font-weight="700" text-anchor="start">THE CROWD / ΦΑΚΕΛΟΣ 05</text><text x="36" y="93" fill="#202a2d" font-size="32" font-weight="700" text-anchor="start">Από την πόλη στην ψηφοφορία</text><line x1="36" y1="116" x2="764" y2="116" stroke="#202a2d" stroke-width="3"/><rect x="36" y="150" width="728" height="115" fill="#e5ded1"/><text x="60" y="189" fill="#202a2d" font-size="29" font-weight="700" text-anchor="start">Κάτοικοι της πόλης</text><text x="60" y="232" fill="#202a2d" font-size="25" font-weight="500" text-anchor="start">Η συνολική τους στάση δεν έχει μετρηθεί.</text><line x1="400" y1="280" x2="400" y2="328" stroke="#202a2d" stroke-width="3"/><text x="400" y="324" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">▼</text><rect x="36" y="345" width="728" height="145" fill="#e3eae4"/><text x="60" y="387" fill="#202a2d" font-size="28" font-weight="700" text-anchor="start">Ανοιχτός σύνδεσμος ψηφοφορίας</text><text x="60" y="431" fill="#202a2d" font-size="24" font-weight="500" text-anchor="start">Κυκλοφόρησε σε ομάδα κατά του σταθμού.</text><text x="60" y="467" fill="#202a2d" font-size="25" font-weight="500" text-anchor="start">Ο καθένας επέλεξε αν θα απαντήσει.</text><text x="36" y="553" fill="#202a2d" font-size="30" font-weight="700" text-anchor="start">Απάντησαν 1.000 άτομα</text><rect x="36" y="586" width="567.84" height="64" fill="#176b70"/><rect x="603.84" y="586" width="160.16" height="64" fill="#d3c5ab"/><text x="36" y="696" fill="#176b70" font-size="27" font-weight="700" text-anchor="start">780 υπέρ (78%)</text><text x="764" y="696" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">220 λοιπές απαντήσεις</text><text x="36" y="769" fill="#202a2d" font-size="29" font-weight="700" text-anchor="start">Το 78% αφορά ποια ομάδα;</text><line x1="36" y1="840" x2="764" y2="840" stroke="#c7c9bd" stroke-width="2"/><text x="36" y="875" fill="#202a2d" font-size="20" font-weight="500" text-anchor="start">Φανταστικά δεδομένα • Εκπαιδευτική προσομοίωση</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc"><title id="title">Τρεις τρόποι να πεις τη μεταβολή</title><desc id="desc">Αύξηση μίας ποσοστιαίας μονάδας ή 50 τοις εκατό σχετικά ή δέκα επιπλέον παράπονα ανά χίλια.</desc><rect width="800" height="900" fill="#f7f1e5"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="42" fill="#176b70" font-size="21" font-weight="700" text-anchor="start">THE CROWD / ΦΑΚΕΛΟΣ 05</text><text x="36" y="93" fill="#202a2d" font-size="32" font-weight="700" text-anchor="start">Τρεις τρόποι να πεις τη μεταβολή</text><line x1="36" y1="116" x2="764" y2="116" stroke="#202a2d" stroke-width="3"/><text x="36" y="175" fill="#176b70" font-size="30" font-weight="700" text-anchor="start">Απόλυτη μεταβολή</text><text x="36" y="230" fill="#202a2d" font-size="30" font-weight="500" text-anchor="start">3% − 2% = 1 ποσοστιαία μονάδα</text><text x="36" y="345" fill="#176b70" font-size="30" font-weight="700" text-anchor="start">Σχετική μεταβολή</text><text x="36" y="400" fill="#202a2d" font-size="30" font-weight="500" text-anchor="start">(3 − 2) / 2 × 100 = 50%</text><text x="36" y="515" fill="#176b70" font-size="30" font-weight="700" text-anchor="start">Με τον ίδιο παρονομαστή</text><text x="36" y="570" fill="#202a2d" font-size="30" font-weight="500" text-anchor="start">30 − 20 = 10 επιπλέον ανά 1.000</text><text x="36" y="710" fill="#202a2d" font-size="28" font-weight="700" text-anchor="start">Οι τρεις περιγραφές είναι συμβατές.</text><text x="36" y="765" fill="#202a2d" font-size="27" font-weight="500" text-anchor="start">Τα δεδομένα δεν μετρούν ατυχήματα.</text><line x1="36" y1="840" x2="764" y2="840" stroke="#c7c9bd" stroke-width="2"/><text x="36" y="875" fill="#202a2d" font-size="20" font-weight="500" text-anchor="start">Φανταστικά δεδομένα • Εκπαιδευτική προσομοίωση</text></g></svg>
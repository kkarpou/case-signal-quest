<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc"><title id="title">Ίδιοι αριθμοί, δύο κλίμακες</title><desc id="desc">Και τα δύο ραβδογράμματα δείχνουν 2% το 2024 και 3% το 2025. Το πρώτο έχει άξονα 0 έως 4%, το δεύτερο 1,9 έως 3,1%.</desc><rect width="800" height="1080" fill="#f7f1e5"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="42" fill="#176b70" font-size="21" font-weight="700" text-anchor="start">THE CROWD / ΦΑΚΕΛΟΣ 05</text><text x="36" y="93" fill="#202a2d" font-size="32" font-weight="700" text-anchor="start">Ίδιοι αριθμοί, δύο κλίμακες</text><line x1="36" y1="116" x2="764" y2="116" stroke="#202a2d" stroke-width="3"/><text x="36" y="162" fill="#202a2d" font-size="28" font-weight="700" text-anchor="start">Α. Κλίμακα 0%–4%</text><line x1="105" y1="424.0" x2="755" y2="424.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="433.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">0%</text><line x1="105" y1="369.0" x2="755" y2="369.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="378.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">1%</text><line x1="105" y1="314.0" x2="755" y2="314.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="323.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">2%</text><line x1="105" y1="259.0" x2="755" y2="259.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="268.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">3%</text><line x1="105" y1="204.0" x2="755" y2="204.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="213.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">4%</text><line x1="105" y1="204" x2="105" y2="424" stroke="#202a2d" stroke-width="2"/><line x1="105" y1="424" x2="755" y2="424" stroke="#202a2d" stroke-width="2"/><rect x="202.5" y="314.0" width="130" height="110.0" fill="#176b70"/><text x="267.5" y="301.0" fill="#202a2d" font-size="28" font-weight="700" text-anchor="middle">2%</text><text x="267.5" y="460" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">2024</text><rect x="527.5" y="259.0" width="130" height="165.0" fill="#a13f39"/><text x="592.5" y="246.0" fill="#202a2d" font-size="28" font-weight="700" text-anchor="middle">3%</text><text x="592.5" y="460" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">2025</text><text x="36" y="580" fill="#202a2d" font-size="28" font-weight="700" text-anchor="start">Β. Κλίμακα 1,9%–3,1%</text><line x1="105" y1="842.0" x2="755" y2="842.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="851.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">1,9%</text><line x1="105" y1="787.0" x2="755" y2="787.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="796.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">2,2%</text><line x1="105" y1="732.0" x2="755" y2="732.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="741.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">2,5%</text><line x1="105" y1="677.0" x2="755" y2="677.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="686.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">2,8%</text><line x1="105" y1="622.0" x2="755" y2="622.0" stroke="#c7c9bd" stroke-width="2"/><text x="91" y="631.0" fill="#202a2d" font-size="23" font-weight="500" text-anchor="end">3,1%</text><line x1="105" y1="622" x2="105" y2="842" stroke="#202a2d" stroke-width="2"/><line x1="105" y1="842" x2="755" y2="842" stroke="#202a2d" stroke-width="2"/><rect x="202.5" y="823.6666666666666" width="130" height="18.333333333333346" fill="#176b70"/><text x="267.5" y="810.6666666666666" fill="#202a2d" font-size="28" font-weight="700" text-anchor="middle">2%</text><text x="267.5" y="878" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">2024</text><rect x="527.5" y="640.3333333333334" width="130" height="201.66666666666666" fill="#a13f39"/><text x="592.5" y="627.3333333333334" fill="#202a2d" font-size="28" font-weight="700" text-anchor="middle">3%</text><text x="592.5" y="878" fill="#202a2d" font-size="25" font-weight="500" text-anchor="middle">2025</text><text x="36" y="530" fill="#202a2d" font-size="24" font-weight="500" text-anchor="start">Ίδιες τιμές και ίδιο ύψος περιοχής σχεδίασης.</text><path d="M 96 835 l 8 -7 l 8 7 l 8 -7" fill="none" stroke="#a13f39" stroke-width="3"/><text x="36" y="935" fill="#a13f39" font-size="23" font-weight="700" text-anchor="start">Προσοχή: ο δεύτερος άξονας δεν αρχίζει από 0.</text><text x="36" y="988" fill="#202a2d" font-size="23" font-weight="500" text-anchor="start">Ποιο γράφημα κάνει την αύξηση να φαίνεται μεγαλύτερη;</text><line x1="36" y1="1020" x2="764" y2="1020" stroke="#c7c9bd" stroke-width="2"/><text x="36" y="1055" fill="#202a2d" font-size="20" font-weight="500" text-anchor="start">Φανταστικά δεδομένα • Εκπαιδευτική προσομοίωση</text></g></svg>
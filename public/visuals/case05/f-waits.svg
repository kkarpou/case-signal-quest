<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc"><title id="title">Πώς μοιάζει μια «τυπική» αναμονή;</title><desc id="desc">Πέντε σημεία στις θέσεις 1, 2, 2, 3 και 22 λεπτά. Οι δύο τιμές 2 εμφανίζονται κατακόρυφα στοιβαγμένες.</desc><rect width="800" height="900" fill="#f7f1e5"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="42" fill="#176b70" font-size="21" font-weight="700" text-anchor="start">THE CROWD / ΦΑΚΕΛΟΣ 05</text><text x="36" y="93" fill="#202a2d" font-size="32" font-weight="700" text-anchor="start">Πώς μοιάζει μια «τυπική» αναμονή;</text><line x1="36" y1="116" x2="764" y2="116" stroke="#202a2d" stroke-width="3"/><text x="36" y="165" fill="#202a2d" font-size="28" font-weight="500" text-anchor="start">Πέντε αναμονές: 1, 2, 2, 3, 22 λεπτά</text><text x="36" y="216" fill="#202a2d" font-size="25" font-weight="500" text-anchor="start">Κάθε κύκλος = μία παρατήρηση</text><line x1="72.0" y1="275" x2="72.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="72.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">0</text><line x1="182.0" y1="275" x2="182.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="182.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">4</text><line x1="292.0" y1="275" x2="292.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="292.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">8</text><line x1="402.0" y1="275" x2="402.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="402.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">12</text><line x1="512.0" y1="275" x2="512.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="512.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">16</text><line x1="622.0" y1="275" x2="622.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="622.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">20</text><line x1="732.0" y1="275" x2="732.0" y2="560" stroke="#c7c9bd" stroke-width="2"/><text x="732.0" y="605" fill="#202a2d" font-size="26" font-weight="500" text-anchor="middle">24</text><line x1="72.0" y1="560" x2="732.0" y2="560" stroke="#202a2d" stroke-width="3"/><text x="400" y="657" fill="#202a2d" font-size="27" font-weight="500" text-anchor="middle">Χρόνος αναμονής (λεπτά)</text><circle cx="99.5" cy="525" r="17" fill="#176b70"/><circle cx="127.0" cy="525" r="17" fill="#176b70"/><circle cx="127.0" cy="475" r="17" fill="#176b70"/><circle cx="154.5" cy="525" r="17" fill="#176b70"/><circle cx="677.0" cy="525" r="17" fill="#176b70"/><text x="36" y="734" fill="#202a2d" font-size="26" font-weight="700" text-anchor="start">Πού βρίσκονται οι περισσότερες αναμονές;</text><text x="36" y="790" fill="#202a2d" font-size="25" font-weight="500" text-anchor="start">Ποια τιμή απέχει περισσότερο από τις άλλες;</text><line x1="36" y1="840" x2="764" y2="840" stroke="#c7c9bd" stroke-width="2"/><text x="36" y="875" fill="#202a2d" font-size="20" font-weight="500" text-anchor="start">Φανταστικά δεδομένα • Εκπαιδευτική προσομοίωση</text></g></svg>
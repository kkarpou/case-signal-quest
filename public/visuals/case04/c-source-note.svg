<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">Τεχνικό σημείωμα</title><desc id="desc">Προσομοιωμένο τεχνικό σημείωμα. Οι εργασίες μπορεί να προκαλέσουν καθυστερήσεις. Δεν αποτελεί συνολική τεχνική πιστοποίηση ασφάλειας.</desc><g font-family="IBM Plex Sans, DejaVu Sans, sans-serif"><rect x="0" y="0" width="800" height="960" rx="0" fill="#f7f1e5" stroke="none" stroke-width="2"/><rect x="0" y="0" width="800" height="12" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="40" y="55" font-size="19" fill="#176b70" font-weight="700">THE SIGNAL FILES / THE CUT</text><text x="40" y="105" font-size="19" fill="#626b68" font-weight="700">E4-C / ΠΡΩΤΟΓΕΝΗΣ ΠΗΓΗ ΣΕΝΑΡΙΟΥ</text><text x="40" y="158" font-size="32" fill="#202a2d" font-weight="700">Τεχνικό σημείωμα</text><rect x="40" y="201" width="720" height="660" rx="0" fill="#fffdf7" stroke="#202a2d" stroke-width="2"/><text x="70" y="255" font-size="23" fill="#176b70" font-weight="700">ΕΝΗΜΕΡΩΣΗ ΓΙΑ ΤΙΣ ΕΡΓΑΣΙΕΣ</text><text x="70" y="294" font-size="16" fill="#626b68" font-weight="700">ΑΠΟΣΠΑΣΜΑ · ΕΠΑΛΗΘΕΥΜΕΝΟ ΣΤΟ ΣΕΝΑΡΙΟ</text><path d="M70 321 H730" stroke="#b9b8ad"/><text x="70" y="379" font-size="21" fill="#176b70" font-weight="700">01</text><text x="70" y="425" font-size="29" fill="#202a2d" font-weight="400">Οι εργασίες μπορεί να προκαλέσουν</text><text x="70" y="467" font-size="29" fill="#202a2d" font-weight="400">καθυστερήσεις.</text><text x="70" y="563" font-size="18" fill="#626b68" font-weight="700">ΣΧΕΤΙΚΗ ΔΗΜΟΣΙΑ ΕΝΗΜΕΡΩΣΗ</text><text x="70" y="610" font-size="26" fill="#202a2d" font-weight="400">«Για μικροκαθυστερήσεις.</text><text x="70" y="649" font-size="26" fill="#202a2d" font-weight="400">Δεν υπάρχει μηδενικό ρίσκο</text><text x="70" y="688" font-size="26" fill="#202a2d" font-weight="400">καθυστέρησης.»</text><text x="70" y="804" font-size="22" fill="#176b70" font-weight="700">Σύγκρινε το κείμενο με τον ισχυρισμό.</text><path d="M40 898 H760" stroke="#b9b8ad"/><text x="40" y="929" font-size="17" fill="#626b68" font-weight="400">ΕΚΠΑΙΔΕΥΤΙΚΗ ΠΡΟΣΟΜΟΙΩΣΗ · ΥΠΟΘΕΣΗ 04</text></g></svg>
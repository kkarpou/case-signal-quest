<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">Τα δώδεκα δευτερόλεπτα</title><desc id="desc">Χρονογραμμή είκοσι δευτερολέπτων: δώδεκα προηγούμενα και οκτώ που διατηρήθηκαν. Η προηγούμενη ερώτηση και απάντηση αναφέρονται σε μικροκαθυστερήσεις. Οι επιμέρους χρόνοι ομιλίας δεν είναι μετρημένοι.</desc><g font-family="IBM Plex Sans, DejaVu Sans, sans-serif"><rect x="0" y="0" width="800" height="960" rx="0" fill="#f7f1e5" stroke="none" stroke-width="2"/><rect x="0" y="0" width="800" height="12" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="40" y="55" font-size="19" fill="#176b70" font-weight="700">THE SIGNAL FILES / THE CUT</text><text x="40" y="105" font-size="19" fill="#626b68" font-weight="700">E4-B / ΠΛΗΡΕΣ ΤΜΗΜΑ 20″</text><text x="40" y="158" font-size="32" fill="#202a2d" font-weight="700">Τα δώδεκα δευτερόλεπτα</text><text x="40" y="212" font-size="18" fill="#626b68" font-weight="700">ΧΡΟΝΟΓΡΑΜΜΗ ΤΗΣ ΠΡΟΣΟΜΟΙΩΣΗΣ</text><rect x="40" y="235" width="432" height="64" rx="0" fill="#d6e7e3" stroke="none" stroke-width="2"/><rect x="472" y="235" width="288" height="64" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="63" y="276" font-size="22" fill="#176b70" font-weight="700">ΠΡΟΗΓΟΥΜΕΝΑ 12″</text><text x="495" y="276" font-size="21" fill="#fff" font-weight="700">ΑΠΟΣΠΑΣΜΑ 8″</text><text x="40" y="329" font-size="20" fill="#202a2d" font-weight="400">0″</text><text x="454" y="329" font-size="20" fill="#202a2d" font-weight="400">12″</text><text x="718" y="329" font-size="20" fill="#202a2d" font-weight="400">20″</text><rect x="40" y="358" width="720" height="295" rx="6" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="64" y="401" font-size="19" fill="#176b70" font-weight="700">ΠΡΙΝ ΑΠΟ ΤΗ ΦΡΑΣΗ</text><text x="64" y="446" font-size="24" fill="#202a2d" font-weight="400">Ερώτηση: «Κατάρρευση ή μικροκαθυστερήσεις</text><text x="64" y="483" font-size="24" fill="#202a2d" font-weight="400">κατά τις εργασίες;»</text><text x="64" y="548" font-size="24" fill="#202a2d" font-weight="400">Απάντηση: «Για μικροκαθυστερήσεις.</text><text x="64" y="585" font-size="24" fill="#202a2d" font-weight="400">Δεν υπάρχει μηδενικό ρίσκο καθυστέρησης.»</text><rect x="40" y="678" width="720" height="159" rx="6" fill="#176b70" stroke="none" stroke-width="2"/><text x="64" y="722" font-size="18" fill="#bce0d9" font-weight="700">Η ΙΔΙΑ ΦΡΑΣΗ · ΧΩΡΙΣ ΑΛΛΑΓΗ ΛΕΞΕΩΝ</text><text x="64" y="770" font-size="26" fill="#fff" font-weight="400">«Δεν μπορούμε να εγγυηθούμε</text><text x="64" y="809" font-size="26" fill="#fff" font-weight="400">ότι δεν υπάρχει κίνδυνος.»</text><path d="M40 898 H760" stroke="#b9b8ad"/><text x="40" y="929" font-size="17" fill="#626b68" font-weight="400">ΕΚΠΑΙΔΕΥΤΙΚΗ ΠΡΟΣΟΜΟΙΩΣΗ · ΥΠΟΘΕΣΗ 04</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">Μια συνθετική απεικόνιση</title><desc id="desc">Σχηματικό avatar με εμφανή γνωστοποίηση ότι είναι συνθετικό. Το κείμενο αναφέρει πιθανές καθυστερήσεις και παραπέμπει στο τεκμήριο E4-C.</desc><g font-family="IBM Plex Sans, DejaVu Sans, sans-serif"><rect x="0" y="0" width="800" height="960" rx="0" fill="#f7f1e5" stroke="none" stroke-width="2"/><rect x="0" y="0" width="800" height="12" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="40" y="55" font-size="19" fill="#176b70" font-weight="700">THE SIGNAL FILES / THE CUT</text><text x="40" y="105" font-size="19" fill="#626b68" font-weight="700">E4-D / ΕΠΕΞΗΓΗΣΗ ΜΕ AVATAR</text><text x="40" y="158" font-size="32" fill="#202a2d" font-weight="700">Μια συνθετική απεικόνιση</text><rect x="40" y="205" width="720" height="310" rx="6" fill="#d6e7e3" stroke="none" stroke-width="2"/><circle cx="400" cy="310" r="58" fill="#176b70"/><path d="M290 470 Q290 382 400 382 Q510 382 510 470 Z" fill="#176b70"/><text x="238" y="493" font-size="19" fill="#176b70" font-weight="700">ΣΧΗΜΑΤΙΚΟ AVATAR</text><rect x="40" y="535" width="720" height="51" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="62" y="569" font-size="20" fill="#fff" font-weight="700">ΣΥΝΘΕΤΙΚΟΣ ΠΑΡΟΥΣΙΑΣΤΗΣ · ΔΕΝ ΕΙΝΑΙ ΠΡΟΣΩΠΟ</text><text x="64" y="647" font-size="29" fill="#202a2d" font-weight="400">«Οι εργασίες μπορεί να προκαλέσουν</text><text x="64" y="689" font-size="29" fill="#202a2d" font-weight="400">καθυστερήσεις.»</text><text x="64" y="766" font-size="19" fill="#626b68" font-weight="700">ΠΗΓΗ ΚΕΙΜΕΝΟΥ</text><text x="64" y="807" font-size="26" fill="#176b70" font-weight="700">Τεχνικό σημείωμα E4-C</text><text x="64" y="850" font-size="19" fill="#626b68" font-weight="400">Επεξήγηση προσβασιμότητας · με απομαγνητοφώνηση</text><path d="M40 898 H760" stroke="#b9b8ad"/><text x="40" y="929" font-size="17" fill="#626b68" font-weight="400">ΕΚΠΑΙΔΕΥΤΙΚΗ ΠΡΟΣΟΜΟΙΩΣΗ · ΥΠΟΘΕΣΗ 04</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">Το γνωστό κανάλι</title><desc id="desc">Αποκάλυψη μετά την επιλογή ελέγχου: η KATE διαψεύδει το αίτημα μέσω του γνωστού καναλιού. Δεν προκύπτει ποιος ή με ποια τεχνολογία παρήγαγε τον ήχο.</desc><g font-family="IBM Plex Sans, DejaVu Sans, sans-serif"><rect x="0" y="0" width="800" height="960" rx="0" fill="#f7f1e5" stroke="none" stroke-width="2"/><rect x="0" y="0" width="800" height="12" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="40" y="55" font-size="19" fill="#176b70" font-weight="700">THE SIGNAL FILES / THE CUT</text><text x="40" y="105" font-size="19" fill="#626b68" font-weight="700">E4-E / ΜΕΤΑ ΤΗΝ ΑΝΕΞΑΡΤΗΤΗ ΕΠΑΛΗΘΕΥΣΗ</text><text x="40" y="158" font-size="32" fill="#202a2d" font-weight="700">Το γνωστό κανάλι</text><rect x="40" y="205" width="720" height="627" rx="8" fill="#fffdf7" stroke="#202a2d" stroke-width="2"/><text x="64" y="253" font-size="20" fill="#176b70" font-weight="700">ΟΜΑΔΑ SIGNAL · ΥΠΑΡΧΟΥΣΑ ΣΥΝΟΜΙΛΙΑ</text><rect x="120" y="293" width="610" height="168" rx="12" fill="#e4e6dd" stroke="none" stroke-width="2"/><text x="145" y="333" font-size="18" fill="#626b68" font-weight="700">ΕΣΥ</text><text x="145" y="376" font-size="26" fill="#202a2d" font-weight="400">Kate, ζήτησες να ανεβάσουμε</text><text x="145" y="415" font-size="26" fill="#202a2d" font-weight="400">ταυτότητες κατοίκων;</text><rect x="64" y="490" width="636" height="158" rx="12" fill="#d6e7e3" stroke="none" stroke-width="2"/><text x="89" y="531" font-size="18" fill="#176b70" font-weight="700">KATE · ΓΝΩΣΤΟ ΚΑΝΑΛΙ</text><text x="89" y="575" font-size="26" fill="#202a2d" font-weight="400">Όχι. Δεν έστειλα αυτό το αίτημα.</text><text x="64" y="716" font-size="23" fill="#202a2d" font-weight="400">Το αίτημα δεν προέρχεται από την KATE.</text><text x="64" y="752" font-size="23" fill="#202a2d" font-weight="400">Παραμένει άγνωστο πώς παράχθηκε ο ήχος.</text><path d="M40 898 H760" stroke="#b9b8ad"/><text x="40" y="929" font-size="17" fill="#626b68" font-weight="400">ΕΚΠΑΙΔΕΥΤΙΚΗ ΠΡΟΣΟΜΟΙΩΣΗ · ΥΠΟΘΕΣΗ 04</text></g></svg>
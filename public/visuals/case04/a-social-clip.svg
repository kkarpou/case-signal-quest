<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">Οκτώ δευτερόλεπτα</title><desc id="desc">Προσομοιωμένη ανάρτηση. Η φράση του ομιλητή διαχωρίζεται από τη λεζάντα που ισχυρίζεται άμεσο κίνδυνο κατάρρευσης. Δεν υπάρχει αναπαραγώγιμο βίντεο.</desc><g font-family="IBM Plex Sans, DejaVu Sans, sans-serif"><rect x="0" y="0" width="800" height="960" rx="0" fill="#f7f1e5" stroke="none" stroke-width="2"/><rect x="0" y="0" width="800" height="12" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="40" y="55" font-size="19" fill="#176b70" font-weight="700">THE SIGNAL FILES / THE CUT</text><text x="40" y="105" font-size="19" fill="#626b68" font-weight="700">E4-A / ΑΝΑΡΤΗΣΗ ΜΕ ΑΠΟΣΠΑΣΜΑ</text><text x="40" y="158" font-size="32" fill="#202a2d" font-weight="700">Οκτώ δευτερόλεπτα</text><rect x="40" y="195" width="720" height="660" rx="8" fill="#fffdf7" stroke="#202a2d" stroke-width="2"/><text x="64" y="240" font-size="19" fill="#626b68" font-weight="700">ΔΗΜΟΣΙΑ ΑΝΑΡΤΗΣΗ · ΠΗΓΗ ΠΡΟΣ ΕΛΕΓΧΟ</text><rect x="64" y="273" width="672" height="245" rx="6" fill="#263c40" stroke="none" stroke-width="2"/><text x="92" y="315" font-size="18" fill="#a7cccc" font-weight="700">ΚΑΡΤΑ ΑΠΟΜΑΓΝΗΤΟΦΩΝΗΣΗΣ</text><text x="92" y="376" font-size="29" fill="#ffffff" font-weight="400">«Δεν μπορούμε να εγγυηθούμε</text><text x="92" y="418" font-size="29" fill="#ffffff" font-weight="400">ότι δεν υπάρχει κίνδυνος.»</text><text x="92" y="489" font-size="19" fill="#ffffff" font-weight="700">ΑΠΟΣΠΑΣΜΑ 8″</text><text x="64" y="565" font-size="20" fill="#a13f39" font-weight="700">ΛΕΖΑΝΤΑ ΤΗΣ ΑΝΑΡΤΗΣΗΣ</text><text x="64" y="610" font-size="30" fill="#202a2d" font-weight="400">«Ομολογία άμεσου κινδύνου</text><text x="64" y="653" font-size="30" fill="#202a2d" font-weight="400">κατάρρευσης!»</text><path d="M64 690 H736" stroke="#ccc7bb"/><text x="64" y="736" font-size="23" fill="#202a2d" font-weight="400">Δεν περιλαμβάνεται η προηγούμενη ερώτηση.</text><text x="64" y="772" font-size="23" fill="#202a2d" font-weight="400">Δεν δίνεται το επόμενο τμήμα.</text><path d="M40 898 H760" stroke="#b9b8ad"/><text x="40" y="929" font-size="17" fill="#626b68" font-weight="400">ΕΚΠΑΙΔΕΥΤΙΚΗ ΠΡΟΣΟΜΟΙΩΣΗ · ΥΠΟΘΕΣΗ 04</text></g></svg>
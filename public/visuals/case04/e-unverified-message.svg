<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">Ένα επείγον αίτημα</title><desc id="desc">Μεταγραφή προσομοιωμένου ύποπτου ηχητικού. Ζητά επείγουσα μεταφόρτωση ταυτοτήτων. Ο σύνδεσμος είναι αδρανές κείμενο. Δεν υπάρχει πραγματικός ήχος ή κλωνοποίηση φωνής.</desc><g font-family="IBM Plex Sans, DejaVu Sans, sans-serif"><rect x="0" y="0" width="800" height="960" rx="0" fill="#f7f1e5" stroke="none" stroke-width="2"/><rect x="0" y="0" width="800" height="12" rx="0" fill="#176b70" stroke="none" stroke-width="2"/><text x="40" y="55" font-size="19" fill="#176b70" font-weight="700">THE SIGNAL FILES / THE CUT</text><text x="40" y="105" font-size="19" fill="#626b68" font-weight="700">E4-E / ΕΙΣΕΡΧΟΜΕΝΟ ΜΗΝΥΜΑ</text><text x="40" y="158" font-size="32" fill="#202a2d" font-weight="700">Ένα επείγον αίτημα</text><rect x="40" y="201" width="720" height="651" rx="8" fill="#fffdf7" stroke="#202a2d" stroke-width="2"/><text x="65" y="249" font-size="22" fill="#202a2d" font-weight="700">ΟΝΟΜΑ ΠΟΥ ΕΜΦΑΝΙΖΕΤΑΙ: KATE</text><text x="65" y="288" font-size="21" fill="#626b68" font-weight="400">Η ταυτότητα αποστολέα δεν έχει επαληθευτεί.</text><rect x="65" y="320" width="670" height="63" rx="8" fill="#e4e6dd" stroke="none" stroke-width="2"/><text x="87" y="361" font-size="22" fill="#176b70" font-weight="700">ΗΧΗΤΙΚΟ ΜΗΝΥΜΑ · ΜΕΤΑΓΡΑΦΗ</text><text x="64" y="445" font-size="27" fill="#202a2d" font-weight="400">«Επείγον. Ανεβάστε τις ταυτότητες</text><text x="64" y="485" font-size="27" fill="#202a2d" font-weight="400">των κατοίκων στον σύνδεσμο</text><text x="64" y="525" font-size="27" fill="#202a2d" font-weight="400">για να προχωρήσουμε.»</text><rect x="65" y="575" width="670" height="67" rx="6" fill="#f4e2da" stroke="none" stroke-width="2"/><text x="85" y="616" font-size="24" fill="#a13f39" font-weight="400">[Σύνδεσμος μεταφόρτωσης ταυτοτήτων]</text><text x="64" y="707" font-size="23" fill="#202a2d" font-weight="400">Στο σενάριο η φωνή μοιάζει με της KATE.</text><text x="64" y="743" font-size="23" fill="#202a2d" font-weight="400">Δεν έχουμε ακόμη επιβεβαίωση</text><text x="64" y="779" font-size="23" fill="#202a2d" font-weight="400">από το γνωστό κανάλι της ομάδας.</text><path d="M40 898 H760" stroke="#b9b8ad"/><text x="40" y="929" font-size="17" fill="#626b68" font-weight="400">ΕΚΠΑΙΔΕΥΤΙΚΗ ΠΡΟΣΟΜΟΙΩΣΗ · ΥΠΟΘΕΣΗ 04</text></g></svg>